<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahir Foysal | Portfolio</title>
    <style>
        /* --- ALL STYLES ARE HERE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #FFFDD0; /* Your requested Cream color */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #2A2218; /* Deep warm brown text for good contrast */
        }

        /* Top Right Header */
        .top-header {
            display: flex;
            justify-content: flex-end;
            padding: 50px 60px;
            background-color: #E8DCC0; /* Your requested darker top color */
            border-bottom: 1px solid rgba(0,0,0,0.05); 
        }

        .profile-info { text-align: right; }

        .profile-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: #1A1510; 
        }

        .profile-info .role {
            font-size: 0.95rem;
            color: #4A3F32;
            margin-bottom: 6px;
        }

        .profile-info .contact {
            font-size: 0.9rem;
            color: #5C4F40;
        }

        .profile-info .contact a {
            color: #5C4F40;
            text-decoration: none;
            transition: color 0.2s;
        }

        .profile-info .contact a:hover { color: #25D366; }

        /* Middle Welcome Section */
        .welcome-section {
            text-align: center;
            padding: 60px 20px 80px 20px;
        }

        .welcome-section h2 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            max-width: 800px;
            margin: 0 auto;
            color: #1A1510;
        }

        /* Image Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 24px; 
            padding: 0 40px 80px 40px; 
            max-width: 1400px;
            margin: 0 auto; 
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            background-color: #E8DCC0; /* Matches the top header color */
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
        }

        .gallery img:hover {
            transform: translateY(-6px); 
            box-shadow: 0 16px 32px rgba(0,0,0,0.15); 
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .top-header { 
                padding: 30px 20px; 
                justify-content: center; 
            }
            .profile-info { text-align: center; }
            .welcome-section { padding: 40px 20px 60px 20px; }
            .welcome-section h2 { font-size: 2.2rem; }
            .gallery { padding: 0 16px 60px 16px; gap: 16px; }
        }
    </style>
</head>
